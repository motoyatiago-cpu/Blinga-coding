<style>
/* 卷轴基础样式 */
.couplet-scroll {
    width: 60px;
    position: fixed;
    top: 30%;
    background-color: red;
    text-align: center;
    font-family: 楷体;
    font-size: 36px;
    color: black;
    overflow: hidden;
    height: 0; /* 初始高度为0，实现卷轴收起 */
    transition: height 2s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: top center;
}

/* 左侧卷轴 */
#leftCouplet {
    left: 0;
    transform: rotate(-1deg);
}

/* 右侧卷轴 */
#rightCouplet {
    right: 0;
    transform: rotate(1deg);
}

/* 卷轴展开状态 */
.couplet-unfold {
    height: 360px; /* 7行文字，每行约50px高度 */
    transform: rotate(0deg);
}

/* 木质轴头效果 */
.couplet-scroll::before,
.couplet-scroll::after {
    content: "";
    position: absolute;
    left: 0;
    width: 100%;
    height: 20px;
    background: linear-gradient(90deg, #8b4513, #cd853f, #8b4513);
    border-radius: 2px;
    z-index: 2;
}
.couplet-scroll::before {
    top: 0;
    border-bottom: 1px solid #5c2e08;
}
.couplet-scroll::after {
    bottom: 0;
    border-top: 1px solid #5c2e08;
}

/* 文字容器，避免被轴头遮挡 */
.couplet-text {
    position: absolute;
    top: 20px;
    left: 0;
    width: 100%;
    height: calc(100% - 40px);
    display: flex;
    flex-direction: column;
    justify-content: space-around; /* 文字均匀分布 */
}

/* 单个文字样式 - 核心逐字动画 */
.couplet-char {
    position: relative;
    opacity: 0;
    transform: translateY(-50px); /* 初始在顶部上方 */
    transition:
        opacity 0.5s ease-out,
        transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}

/* 文字显示状态 */
.couplet-char.show {
    opacity: 1;
    transform: translateY(0); /* 下落至目标位置 */
}
</style>

<!-- 左侧对联（拆分为单个文字节点） -->
<div id="leftCouplet" class="couplet-scroll">
    <div class="couplet-text">
        <span class="couplet-char">银</span>
        <span class="couplet-char">蛇</span>
        <span class="couplet-char">积</span>

        <span class="couplet-char">追</span>

</div>

<!-- 右侧对联（拆分为单个文字节点） -->
<div id="rightCouplet" class="couplet-scroll">
    <div class="couplet-text">
        <span class="couplet-char">骏</span>
        <span class="couplet-char">马</span>
        <span class="couplet-char">携</span>
        <span class="couplet-char">瑞</span>

<script>
// 页面加载完成后执行动画
window.addEventListener('load', function() {
    const leftScroll = document.getElementById('leftCouplet');
    const rightScroll = document.getElementById('rightCouplet');
    const leftChars = leftScroll.querySelectorAll('.couplet-char');
    const rightChars = rightScroll.querySelectorAll('.couplet-char');
    const charCount = leftChars.length; // 文字总数（7个）
    const interval = 200; // 每个字下落间隔（ms）
    const scrollDuration = 2000; // 卷轴展开时长（和CSS的transition对应）

    // 第一步：先展开左侧卷轴
    setTimeout(() => {
        leftScroll.classList.add('couplet-unfold');

        // 第二步：左侧卷轴展开完成后（延迟等于展开时长），开始左侧文字逐字下落
        setTimeout(() => {
            leftChars.forEach((char, index) => {
                setTimeout(() => {
                    char.classList.add('show');

                    // 第三步：左侧文字全部下落完成后，开始展开右侧卷轴
                    if (index === charCount - 1) {
                        setTimeout(() => {
                            rightScroll.classList.add('couplet-unfold');

                            // 第四步：右侧卷轴展开完成后，开始右侧文字逐字下落
                            setTimeout(() => {
                                rightChars.forEach((rightChar, rightIndex) => {
                                    setTimeout(() => {
                                        rightChar.classList.add('show');
                                    }, rightIndex * interval);
                                });
                            }, scrollDuration); // 等待右侧卷轴展开完成
                        }, 1000); // 左侧文字完成后延迟300ms，可调整
                    }
                }, index * interval);
            });
        }, scrollDuration);
    }, 1500); // 页面加载后延迟500ms启动，可调整
});

 </script>

        function musicPlay(isPlay) {                                // 获取页面的音频元素（id为audioDom）
            var media = document.querySelector('#audioDom');        // 若需要播放，且音频处于暂停状态 → 执行播放
            if (isPlay && media.paused) {
                media.play();
            }  // 若需要暂停，且音频处于播放状态 → 执行暂停
            if (!isPlay && !media.paused) {
                media.pause();
            }
        }
        function musicInBrowserHandler() {                    // 延迟0ms执行（让代码在事件循环中后置，确保兼容性）
            setTimeout(function () {
                musicPlay(true)                                 // 调用播放函数，启动音频
            }, 0)
        }
        document.body.addEventListener('touchstart', musicInBrowserHandler);   // 为页面body绑定“触摸开始”事件 → 触发音频播放
        document.body.addEventListener('click', musicInBrowserHandler);         // 为页面body绑定“点击”事件 → 触发音频播放
